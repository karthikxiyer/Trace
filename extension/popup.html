<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #6366f1; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px #e0e7ff; }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: default; }
    #error { color: #ef4444; font-size: 12px; margin-top: 8px; }
    #status { font-size: 13px; margin: 10px 0; color: #374151; }
    #current-url {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
      word-break: break-all;
      line-height: 1.4;
      max-height: 48px;
      overflow: hidden;
    }
    #logout-btn {
      margin-top: 8px;
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
      border: 1px solid #e5e7eb;
    }
    #logout-btn:hover { background: #f9fafb; color: #374151; }
    .success { color: #16a34a; }
    .error-msg { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Trace</h1>

  <div id="login-view">
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Sign in</button>
    <p id="error"></p>
  </div>

  <div id="save-view" style="display:none">
    <p id="current-url"></p>
    <button id="save-btn">Save this page</button>
    <p id="status"></p>
    <button id="logout-btn">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
